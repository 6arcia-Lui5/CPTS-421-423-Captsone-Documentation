<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Artifact — Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --cream: #f8f5f0;
      --cream-dark: #e8e4df;
      --navy: #0d1b2a;
      --navy-light: #243b55;
      --gold: #c9a84c;
      --gold-light: #f5e1a4;
      --text-dark: #111;
      --text-muted: #555;
      --error: #c0392b;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: var(--cream);
      font-family: 'DM Sans', sans-serif;
      padding: 1.5rem;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      width: 100%;
      max-width: 440px;
      padding: 2rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      box-sizing: border-box;
      animation: slideIn 0.5s cubic-bezier(0.22,1,0.36,1) forwards;
    }

    .card-top {
      border-top: 3px solid var(--gold);
      border-radius: 12px 12px 0 0;
      margin: -2rem -2rem 1.5rem -2rem;
      height: 0;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      color: var(--text-dark);
      margin-bottom: 0.4rem;
    }
    .subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .field {
      display: flex;
      flex-direction: column;
      margin-bottom: 1rem;
    }
    .field label {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-dark);
      margin-bottom: 0.35rem;
    }
    .field input {
      padding: 0.75rem 1rem;
      font-size: 0.92rem;
      border-radius: 10px;
      border: 1.5px solid var(--cream-dark);
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
    }
    .field input:focus {
      border-color: var(--navy-light);
      box-shadow: 0 0 0 3px rgba(36,59,85,0.1);
    }

    .btn {
      width: 100%;
      padding: 0.9rem;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--gold);
      background: var(--navy);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 1rem;
      transition: box-shadow 0.2s;
    }
    .btn:hover {
      box-shadow: 0 6px 20px rgba(13,27,42,0.3);
    }

    .back-link {
      display: flex;
      justify-content: center;
      font-size: 0.88rem;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--navy); }

    .success-state {
      display: none;
      text-align: center;
    }
    .success-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 1rem;
      border-radius: 50%;
      background: rgba(30,126,92,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }
    .success-state h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      margin-bottom: 0.5rem;
    }
    .success-state p {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 1rem;
    }

    .error-banner {
      display: none;
      align-items: flex-start;
      gap: 0.6rem;
      background: rgba(192,57,43,0.08);
      border: 1px solid rgba(192,57,43,0.25);
      border-radius: 8px;
      padding: 0.7rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.84rem;
      color: var(--error);
    }
    .error-banner.visible { display: flex; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="card">

    <div class="card-top"></div>

    <div id="form-state">
      <h1>Join Artifact</h1>
      <p class="subtitle">Enter your information below to create your Artifact account.</p>

      <div class="error-banner" id="error-banner">
        <span>⚠️</span>
        <span id="error-msg">Invalid input. Please check your entries.</span>
      </div>

      <div class="field">
        <label>First Name</label>
        <input type="text" id="firstName" placeholder="John" autocomplete="given-name"/>
      </div>
      <div class="field">
        <label>Last Name</label>
        <input type="text" id="lastName" placeholder="Doe" autocomplete="family-name"/>
      </div>
      <div class="field">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@artifact.com" autocomplete="email"/>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" autocomplete="new-password"/>
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <input type="password" id="cpassword" placeholder="Confirm password" autocomplete="new-password"/>
      </div>

      <button class="btn" onclick="handleSubmit()">Sign Up</button>
      <a href="login.html" class="back-link">← Back to login</a>
    </div>

    <div class="success-state" id="success-state">
      <div class="success-icon">✉️</div>
      <h2>Check your email</h2>
      <p>We have sent an email to <strong id="sent-email"></strong>. Follow the instructions to complete your registration.</p>
      <a href="login.html" class="back-link">← Back to login</a>
    </div>

  </div>

  <script>
    function handleSubmit(e) {
      e?.preventDefault();

      const firstName = document.getElementById("firstName").value.trim();
      const lastName = document.getElementById("lastName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("cpassword").value;

      const errorBanner = document.getElementById("error-banner");
      const errorMsg = document.getElementById("error-msg");
      errorBanner.style.display = "none";
      errorMsg.textContent = "";

      const errors = [];
      if (!firstName) errors.push("First name is required.");
      if (!lastName) errors.push("Last name is required.");
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) errors.push("Please enter a valid email address.");
      if (password.length < 8) errors.push("Password must be at least 8 characters.");
      if (password !== confirmPassword) errors.push("Passwords must match.");

      if (errors.length) {
        const ul = document.createElement("ul");
        ul.style.paddingLeft = "20px";
        errors.forEach(err => {
          const li = document.createElement("li");
          li.textContent = err;
          ul.appendChild(li);
        });
        errorMsg.appendChild(ul);
        errorBanner.style.display = "flex";
        return;
      }

      // Success: show confirmation
      console.log("Submitting user:", { firstName, lastName, email });
      document.getElementById("form-state").style.display = "none";
      document.getElementById("sent-email").textContent = email;
      document.getElementById("success-state").style.display = "block";
    }
  </script>

</body>
</html>
